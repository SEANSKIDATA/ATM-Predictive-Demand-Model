<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WFM Decision Lab — Sean Codner</title>
<meta name="description" content="Interactive WFM lever analysis tool. Enter your contact center parameters and find out which operational lever moves service level the most.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A0A0A; color: #F1F5F9; font-family: 'Space Grotesk', system-ui, sans-serif; min-height: 100vh; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: #1E293B; border-radius: 2px; outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #E53E3E; cursor: pointer; border: 2px solid #0A0A0A; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #E53E3E; cursor: pointer; border: 2px solid #0A0A0A; }
  table { border-collapse: collapse; width: 100%; }
  @media (max-width: 700px) {
    .grid-2 { grid-template-columns: 1fr !important; }
    .header-pad { padding: 20px 16px 16px !important; }
    .body-pad { padding: 16px 16px 40px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ── Erlang C math ─────────────────────────────────────────────────────────────
function erlangC(A, N) {
  if (N <= A) return 1;
  let sum = 1, term = 1;
  for (let i = 1; i < N; i++) { term *= A / i; sum += term; }
  const AN = term * A / N;
  return AN / (AN + (1 - A / N) * sum);
}

function serviceLevelFn(agents, A, targetSec, aht) {
  if (agents <= 0 || A <= 0) return 0;
  if (agents <= A) return 0;
  const pw = erlangC(A, agents);
  return Math.min(1, Math.max(0, 1 - pw * Math.exp(-(agents - A) * (targetSec / aht))));
}

function requiredAgents(A, targetSL, targetSec, aht, maxOcc) {
  let N = Math.max(1, Math.ceil(A));
  while (N < 500) {
    if (A / N <= maxOcc) {
      if (serviceLevelFn(N, A, targetSec, aht) >= targetSL) return N;
    }
    N++;
  }
  return N;
}

function runAnalysis(params) {
  const { volume, aht, shrinkage, scheduledFTEs, slTarget, answerSec, maxOcc, intervals } = params;
  const intervalSec = 1800;
  const cpI = volume / intervals;

  // helper: SL given FTE count and scenario params
  function sl(ht, shr, ftes, occ) {
    const a = (cpI * ht) / intervalSec;
    const agents = Math.floor(ftes * (1 - shr));
    if (agents <= 0 || a <= 0) return 0;
    // find required agents under given occ ceiling for honest comparison
    return serviceLevelFn(agents, a, answerSec, ht);
  }

  const A = (cpI * aht) / intervalSec;
  const reqAgents = requiredAgents(A, slTarget, answerSec, aht, maxOcc);
  const reqFTEs = Math.ceil(reqAgents / (1 - shrinkage));
  const agentsOnPhone = Math.floor(scheduledFTEs * (1 - shrinkage));
  const base = serviceLevelFn(agentsOnPhone, A, answerSec, aht);

  // ── FIX 1: Redistribution — always positive, honest about what "redistribution" means
  // If understaffed: redistribution = getting the RIGHT agents on phone (reqAgents)
  // with the same FTE pool by fixing interval placement
  // If overstaffed: redistribution = efficiency opportunity shown as zero (no SL problem)
  const redistAgents = Math.min(agentsOnPhone + (reqAgents - agentsOnPhone), reqAgents);
  const redistDelta = Math.max(0, serviceLevelFn(reqAgents, A, answerSec, aht) - base);

  // ── FIX 2: Occupancy lever — actual Erlang C calc at 85% ceiling
  const reqAgents85 = requiredAgents(A, slTarget, answerSec, aht, 0.85);
  const occ85agents = Math.max(agentsOnPhone, reqAgents85);
  const occ85Delta = Math.max(0, serviceLevelFn(occ85agents, A, answerSec, aht) - base);

  // ── Headcount
  const headAgents = Math.floor(scheduledFTEs * 1.10 * (1 - shrinkage));
  const headDelta = Math.max(0, serviceLevelFn(headAgents, A, answerSec, aht) - base);

  // ── Shrinkage
  const shrAgents = Math.floor(scheduledFTEs * (1 - Math.max(0, shrinkage - 0.05)));
  const shrDelta = Math.max(0, serviceLevelFn(shrAgents, A, answerSec, aht) - base);

  // ── AHT
  const ahtAgents = agentsOnPhone;
  const ahtA = (cpI * aht * 0.85) / intervalSec;
  const ahtDelta = Math.max(0, serviceLevelFn(ahtAgents, ahtA, answerSec, aht * 0.85) - base);

  const levers = [
    { name: "Schedule Redistribution", desc: "Move existing staff into peak demand intervals — zero additional budget", delta: redistDelta, cost: "Zero budget", costColor: "#22C55E", color: "#22C55E" },
    { name: "Add Headcount (+10%)", desc: "Increase scheduled FTEs by 10% through new hires or overtime", delta: headDelta, cost: "High cost", costColor: "#EF4444", color: "#3B82F6" },
    { name: "Reduce Shrinkage (−5pts)", desc: "Improve schedule adherence, reduce unplanned absence", delta: shrDelta, cost: "Medium cost", costColor: "#F59E0B", color: "#A78BFA" },
    { name: "Lower Occupancy Ceiling", desc: "Reduce max occupancy from 90% to 85% — adds buffer capacity", delta: occ85Delta, cost: "Low cost", costColor: "#22C55E", color: "#60A5FA" },
    { name: "Reduce AHT (−15%)", desc: "Coaching or process redesign to cut average handle time", delta: ahtDelta, cost: "High cost", costColor: "#EF4444", color: "#FB923C" },
  ].sort((a, b) => b.delta - a.delta).map((l, i) => ({ ...l, rank: i + 1 }));

  return { base, levers, reqFTEs, reqAgents, A };
}

// ── Components ────────────────────────────────────────────────────────────────
function Slider({ label, value, min, max, step, format, onChange, hint }) {
  return (
    <div style={{ marginBottom: 22 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
        <label style={{ fontSize: 11, color: "#64748B", fontFamily: "'DM Mono', monospace", letterSpacing: "0.5px" }}>{label}</label>
        <span style={{ fontSize: 13, fontWeight: 700, color: "#F1F5F9", fontFamily: "'DM Mono', monospace" }}>{format(value)}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))} />
      {hint && <div style={{ fontSize: 11, color: "#334155", marginTop: 5 }}>{hint}</div>}
    </div>
  );
}

function StatBox({ label, value, color }) {
  return (
    <div style={{ background: "#0F172A", borderRadius: 8, padding: "14px 16px", border: "1px solid #1E293B" }}>
      <div style={{ fontSize: 10, color: "#475569", fontFamily: "'DM Mono', monospace", marginBottom: 6, letterSpacing: "1px" }}>{label}</div>
      <div style={{ fontSize: 20, fontWeight: 800, color: color || "#F1F5F9" }}>{value}</div>
    </div>
  );
}

function LeverRow({ lever, maxDelta }) {
  const pct = Math.min(100, Math.max(0, maxDelta > 0 ? (lever.delta / maxDelta) * 100 : 0));
  const isTop = lever.rank === 1;
  const deltaLabel = `+${(lever.delta * 100).toFixed(1)}%`;
  return (
    <div style={{ marginBottom: 18, padding: isTop ? "14px 16px" : "0", background: isTop ? "#0D1A0D" : "transparent", borderRadius: isTop ? 8 : 0, border: isTop ? "1px solid #14532D" : "none" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3, flexWrap: "wrap" }}>
            <span style={{ fontSize: 10, fontWeight: 700, color: isTop ? "#E53E3E" : "#334155", fontFamily: "'DM Mono', monospace" }}>#{lever.rank}</span>
            <span style={{ fontSize: 13, fontWeight: isTop ? 700 : 500, color: isTop ? "#F1F5F9" : "#94A3B8" }}>{lever.name}</span>
            {isTop && <span style={{ fontSize: 9, background: "#E53E3E", color: "#fff", padding: "2px 7px", borderRadius: 3, fontFamily: "'DM Mono', monospace", letterSpacing: "1px" }}>TOP LEVER</span>}
          </div>
          <div style={{ fontSize: 11, color: "#475569", paddingLeft: 22, lineHeight: 1.4 }}>{lever.desc}</div>
        </div>
        <div style={{ textAlign: "right", marginLeft: 16, flexShrink: 0 }}>
          <div style={{ fontSize: 17, fontWeight: 800, color: lever.delta > 0 ? lever.color : "#475569" }}>{deltaLabel}</div>
          <div style={{ fontSize: 10, color: lever.costColor, fontFamily: "'DM Mono', monospace" }}>{lever.cost}</div>
        </div>
      </div>
      <div style={{ height: 6, background: "#1E293B", borderRadius: 3, overflow: "hidden" }}>
        <div style={{ width: `${pct}%`, height: "100%", background: lever.delta > 0 ? lever.color : "#1E293B", borderRadius: 3, transition: "width 0.5s ease" }} />
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  // FIX 5: Defaults calibrated to show understaffed scenario where redistribution wins
  // 1200 calls, 240s AHT, 34% shrinkage → requires 22 FTEs → default 19 (lightly understaffed)
  const [volume, setVolume] = useState(1200);
  const [aht, setAht] = useState(240);
  const [shrinkage, setShrinkage] = useState(0.34);
  const [scheduledFTEs, setScheduledFTEs] = useState(19);
  const [slTarget, setSlTarget] = useState(0.80);
  const [advanced, setAdvanced] = useState(false);

  const params = { volume, aht, shrinkage, scheduledFTEs, slTarget, answerSec: 20, maxOcc: 0.90, intervals: 16 };
  const { base, levers, reqFTEs } = useMemo(() => runAnalysis(params), [volume, aht, shrinkage, scheduledFTEs, slTarget]);

  const maxDelta = Math.max(...levers.map(l => l.delta), 0.001);
  const pct = v => `${(v * 100).toFixed(1)}%`;
  const gap = scheduledFTEs - reqFTEs;
  const gapLabel = gap >= 0 ? `+${gap} surplus` : `${Math.abs(gap)} short`;
  const gapColor = gap >= 0 ? "#22C55E" : "#EF4444";
  const slColor = base >= slTarget ? "#22C55E" : "#EF4444";

  return (
    <div>
      {/* Header */}
      <div className="header-pad" style={{ background: "linear-gradient(135deg,#0F172A 0%,#1A0505 100%)", borderBottom: "1px solid #1E293B", padding: "32px 40px 28px" }}>
        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
            <div style={{ background: "#E53E3E", color: "#fff", fontSize: 9, fontWeight: 700, letterSpacing: "2px", padding: "4px 10px", borderRadius: 3, fontFamily: "'DM Mono', monospace" }}>INTERACTIVE</div>
            <div style={{ fontSize: 10, color: "#475569", letterSpacing: "2px", fontFamily: "'DM Mono', monospace" }}>WFM DECISION LAB · SEAN CODNER</div>
          </div>
          <h1 style={{ fontSize: 30, fontWeight: 700, letterSpacing: "-0.5px", marginBottom: 8 }}>Which lever moves your service level?</h1>
          <p style={{ fontSize: 13, color: "#64748B", maxWidth: 580, lineHeight: 1.6 }}>
            Enter your contact center parameters. The model tests five common WFM levers against your numbers and ranks them by service level impact — powered by Erlang C queueing math, the same engine behind every major WFM platform.
          </p>
          <div style={{ display: "flex", gap: 8, marginTop: 16, flexWrap: "wrap" }}>
            {["Erlang C", "Interval-level", "Five levers ranked", "Zero-budget options included"].map(t => (
              <span key={t} style={{ fontSize: 10, fontFamily: "'DM Mono', monospace", color: "#475569", border: "1px solid #1E293B", borderRadius: 20, padding: "3px 10px" }}>{t}</span>
            ))}
          </div>
        </div>
      </div>

      {/* Body */}
      <div className="body-pad grid-2" style={{ maxWidth: 900, margin: "0 auto", padding: "28px 40px 60px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>

        {/* Left — Inputs */}
        <div>
          <div style={{ background: "#111827", border: "1px solid #1E293B", borderRadius: 12, padding: "24px", marginBottom: 16 }}>
            <div style={{ fontSize: 10, letterSpacing: "2px", color: "#E53E3E", fontFamily: "'DM Mono', monospace", fontWeight: 700, marginBottom: 22 }}>YOUR PARAMETERS</div>
            <Slider label="DAILY CALL VOLUME" value={volume} min={100} max={8000} step={50}
              format={v => v.toLocaleString() + " calls"} onChange={setVolume}
              hint="Total calls handled in an 8-hour operating day" />
            <Slider label="AVERAGE HANDLE TIME" value={aht} min={60} max={720} step={10}
              format={v => `${v}s  (${(v/60).toFixed(1)} min)`} onChange={setAht}
              hint="Talk time + after-call work combined" />
            <Slider label="SHRINKAGE RATE" value={shrinkage} min={0.10} max={0.55} step={0.01}
              format={v => pct(v)} onChange={setShrinkage}
              hint="Breaks, training, PTO, unproductive time — industry avg 30–40%" />
            <Slider label="SCHEDULED FTEs" value={scheduledFTEs} min={5} max={300} step={1}
              format={v => `${v} FTEs`} onChange={setScheduledFTEs}
              hint="Total agents on today's schedule" />

            <button onClick={() => setAdvanced(!advanced)}
              style={{ background: "none", border: "1px solid #1E293B", borderRadius: 6, padding: "7px 14px", fontSize: 11, color: "#475569", cursor: "pointer", fontFamily: "'DM Mono', monospace", letterSpacing: "1px", width: "100%", textAlign: "left" }}>
              {advanced ? "▲  HIDE ADVANCED SETTINGS" : "▼  ADVANCED SETTINGS"}
            </button>

            {advanced && (
              <div style={{ marginTop: 18, paddingTop: 18, borderTop: "1px solid #1E293B" }}>
                <Slider label="SERVICE LEVEL TARGET" value={slTarget} min={0.60} max={0.95} step={0.01}
                  format={v => pct(v)} onChange={setSlTarget}
                  hint="% of calls answered within 20 seconds — industry standard 80/20" />
              </div>
            )}
          </div>

          {/* Snapshot */}
          <div style={{ background: "#111827", border: "1px solid #1E293B", borderRadius: 12, padding: "20px 24px" }}>
            <div style={{ fontSize: 10, letterSpacing: "2px", color: "#E53E3E", fontFamily: "'DM Mono', monospace", fontWeight: 700, marginBottom: 16 }}>STAFFING SNAPSHOT</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 14 }}>
              <StatBox label="CURRENT SL" value={pct(base)} color={slColor} />
              <StatBox label="NEED" value={`${reqFTEs} FTEs`} />
              <StatBox label="GAP" value={gapLabel} color={gapColor} />
            </div>
            {base < slTarget ? (
              <div style={{ fontSize: 12, color: "#FCA5A5", background: "#1A0505", border: "1px solid #7F1D1D", borderRadius: 6, padding: "10px 14px", lineHeight: 1.5 }}>
                ⚠ Schedule is {pct(slTarget - base)} below target. The top-ranked lever is your fastest path to recovery — check whether it requires budget before reaching for headcount.
              </div>
            ) : (
              <div style={{ fontSize: 12, color: "#86EFAC", background: "#0D1A0D", border: "1px solid #14532D", borderRadius: 6, padding: "10px 14px", lineHeight: 1.5 }}>
                ✓ Schedule meets the {pct(slTarget)} target. Use the lever analysis to identify where efficiency gains are still available.
              </div>
            )}
          </div>
        </div>

        {/* Right — Results */}
        <div>
          <div style={{ background: "#111827", border: "1px solid #1E293B", borderRadius: 12, padding: "24px", marginBottom: 16 }}>
            <div style={{ fontSize: 10, letterSpacing: "2px", color: "#E53E3E", fontFamily: "'DM Mono', monospace", fontWeight: 700, marginBottom: 20 }}>LEVER IMPACT — RANKED</div>
            {levers.map(lever => <LeverRow key={lever.name} lever={lever} maxDelta={maxDelta} />)}
          </div>

          {/* Table */}
          <div style={{ background: "#111827", border: "1px solid #1E293B", borderRadius: 12, padding: "20px 24px" }}>
            <div style={{ fontSize: 10, letterSpacing: "2px", color: "#E53E3E", fontFamily: "'DM Mono', monospace", fontWeight: 700, marginBottom: 14 }}>COMPARISON TABLE</div>
            <table>
              <thead>
                <tr style={{ borderBottom: "1px solid #1E293B" }}>
                  {["#", "Lever", "SL Lift", "Cost"].map(h => (
                    <th key={h} style={{ textAlign: "left", padding: "6px 8px", color: "#334155", fontWeight: 600, fontFamily: "'DM Mono', monospace", fontSize: 10, letterSpacing: "1px" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {levers.map((l, i) => (
                  <tr key={l.name} style={{ borderBottom: i < levers.length - 1 ? "1px solid #0F172A" : "none", background: l.rank === 1 ? "#0D1A0D" : "transparent" }}>
                    <td style={{ padding: "9px 8px", color: l.rank === 1 ? "#E53E3E" : "#334155", fontFamily: "'DM Mono', monospace", fontSize: 11, fontWeight: 700 }}>#{l.rank}</td>
                    <td style={{ padding: "9px 8px", color: l.rank === 1 ? "#F1F5F9" : "#94A3B8", fontWeight: l.rank === 1 ? 700 : 400, fontSize: 12 }}>{l.name}</td>
                    <td style={{ padding: "9px 8px", fontWeight: 700, color: l.delta > 0 ? l.color : "#475569", fontFamily: "'DM Mono', monospace" }}>+{(l.delta * 100).toFixed(1)}%</td>
                    <td style={{ padding: "9px 8px", color: l.costColor, fontSize: 11 }}>{l.cost}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{ marginTop: 14, fontSize: 11, color: "#334155", lineHeight: 1.5, borderTop: "1px solid #1E293B", paddingTop: 12 }}>
              Model assumes 80/20 service level target, 20s answer threshold, 90% max occupancy, 30-min intervals over 8-hour day. Built on Erlang C queueing theory — the methodology behind NICE, Verint, Calabrio, and Genesys.
            </div>
          </div>
        </div>
      </div>

      {/* Footer */}
      <div style={{ borderTop: "1px solid #1E293B", padding: "16px 40px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontSize: 11, color: "#334155", fontFamily: "'DM Mono', monospace" }}>Sean Codner · WFM Decision Lab</div>
        <a href="https://github.com/SEANSKIDATA/WFM-Decision-Lab" target="_blank" rel="noopener noreferrer"
          style={{ fontSize: 11, color: "#475569", fontFamily: "'DM Mono', monospace", textDecoration: "none" }}>
          github.com/SEANSKIDATA/WFM-Decision-Lab →
        </a>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
